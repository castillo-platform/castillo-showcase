<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Finance · Übersicht – Entwürfe, Runde 2</title>
<link rel="stylesheet" href="../../fonts.css">
<style>
:root{
  --bg:#f3f4f8;--card:#fff;--ink:#0f172a;--ink-2:#334155;--ink-3:#556275;--ink-4:#64748b;--line:#e6e8ef;--band:#eef0f4;
  --accent:#4338ca;--accent-soft:#eef0ff;--accent-ink:#3730a3;
  --pos:#15803d;--pos-soft:#e5f5ea;--neg:#c81e1e;--warn:#a1520a;--warn-soft:#fdf1e0;
  --new:#0d9488;--new-soft:#e0f3f1;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#dfe2ea}
body{font-family:'Geist',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* phone frame */
.phone{position:relative;max-width:430px;margin:0 auto;height:100dvh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){.phone{height:min(880px,calc(100dvh - 48px));margin:24px auto;border-radius:36px;box-shadow:0 20px 60px rgba(15,23,42,.18);border:8px solid #111827}}

/* mock strip (not part of the app) */
.mock{flex:none;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:#fff8e6;border-bottom:1px solid #f1e3bd;font-size:14px}
.mock .lbl{font-weight:650;color:#6b5314;white-space:nowrap}
.mock .tabs{display:flex;gap:6px;flex:1;min-width:0}
.mock .tab{flex:1 1 0;min-width:0;height:36px;border-radius:999px;border:1px solid #e9d9ab;background:#fff;font-weight:650;color:#6b5314;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;padding:0 6px}
.mock .tab[aria-current]{background:#6b5314;color:#fff;border-color:#6b5314}
.mock .arr{width:36px;height:36px;display:grid;place-items:center;border-radius:999px;border:1px solid #e9d9ab;background:#fff;color:#6b5314;flex:none}
@media (max-width:420px){.mock .lbl{display:none}.tabsC{--em:none}}@media (max-width:350px){.mock .tab .nm{display:none}}

/* app chrome */
.app{position:relative;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
.bar{flex:none;height:52px;display:flex;align-items:center;gap:6px;padding:0 6px 0 16px;background:rgba(243,244,248,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s;z-index:3}
.bar.lined{border-color:var(--line)}
.bar h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.chip{font-size:14px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:5px 10px;border-radius:999px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2);flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(120px + env(safe-area-inset-bottom))}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:4px 6px calc(env(safe-area-inset-bottom) + 4px);background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--ink-3);min-width:62px;min-height:50px;position:relative}
.nav button[aria-current]{color:var(--accent)}
.nav .dot{position:absolute;top:2px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.sect{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;margin:16px 0 4px;padding:0 4px}
.sect h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
.sect .r{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--ink-3)}
.chev{transition:transform .25s;color:var(--ink-4)}
[aria-expanded=false] .chev{transform:rotate(-90deg)}

/* account rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;min-height:64px;width:100%;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:#f7f8fb}
.nm{flex:1;min-width:0}
.t1{font-size:17px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:15px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{flex:none;max-width:48%;font-size:17px;font-weight:600;text-align:right;white-space:nowrap}
.amt small{display:block;font-size:14px;font-weight:500;color:var(--ink-3)}
.neg{color:var(--neg)}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;letter-spacing:-.02em;flex:none;position:relative}
.logo.soft{background:var(--accent-soft);color:var(--accent-ink)}
.logo.unk{background:#e2e8f0;color:#334155}
.badge{position:absolute;top:-7px;left:-7px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--new);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.state{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:550;margin-top:3px}
.state.warn{color:var(--warn)}
.state svg.i{width:15px;height:15px}
.gochev{color:var(--ink-4);margin-right:-4px}
.chg{font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.chg.up{color:var(--pos)}.chg.dn{color:var(--warn)}
.chg svg.i{width:14px;height:14px}

/* figures */
.big{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:4px 4px 12px;transition:opacity .2s}
.payday{display:block;width:100%;padding:16px 16px 14px}
.payday .top{display:flex;align-items:center;justify-content:space-between;font-size:15px;color:var(--ink-3)}
.payday .fig{display:flex;align-items:baseline;gap:8px;margin-top:6px;flex-wrap:wrap}
.payday .fig b{font-size:32px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.payday .fig span{color:var(--ink-3)}
.track{height:8px;border-radius:9px;background:#eceef4;margin-top:12px;position:relative;overflow:hidden;display:flex;gap:2px}
.track i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;font-size:14px;color:var(--ink-3)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.sums .row{min-height:58px}
.sums .t1{font-weight:600}
.foot{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--ink-3);font-size:14px;margin:18px 0 4px}
.foot button{font-weight:650;color:var(--ink-2);min-height:44px;padding:0 6px}
.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

/* review */
.rv{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px}
.rv+.rv{border-top:1px solid var(--line)}
.rv .why{font-size:15px;color:var(--warn);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-btn{flex:none;min-height:40px;padding:0 13px;border-radius:11px;font-weight:600;font-size:15px;background:#f1f3f7;color:var(--ink-2)}
.pill-btn.go{background:var(--accent-soft);color:var(--accent-ink)}
.head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.head h3{margin:0;font-size:18px;font-weight:650;display:flex;align-items:center;gap:8px}
.head .r{font-size:15px;color:var(--ink-3)}
.count{font-size:14px;font-weight:700;color:var(--new);background:var(--new-soft);padding:2px 8px;border-radius:999px}
.count.w{color:var(--warn);background:var(--warn-soft)}

/* calm booking list */
.clist{margin:0 -14px}
.day{background:#fff}
.dband{position:sticky;top:0;z-index:1;background:var(--band);padding:8px 18px;font-size:15px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between}
.dband span:last-child{font-weight:500;color:var(--ink-3)}
.crow{display:flex;gap:14px;align-items:center;padding:12px 18px 12px 24px;min-height:72px;position:relative;width:100%}
.crow+.crow{border-top:1px solid var(--line)}
.crow .logo{width:42px;height:42px;border-radius:999px}
.crow .t1{font-size:17px;font-weight:500}
.crow .t2{display:flex;gap:7px;align-items:center;margin-top:3px;min-width:0}.crow .t2 .t2{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:14px;padding:1px 8px;border-radius:7px;background:#eef0f5;color:var(--ink-2);flex:none}
.tag.act{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;padding:0 12px;min-height:32px;display:inline-flex;align-items:center;border-radius:9px}
.camt{flex:none;max-width:46%;font-size:17px;font-weight:550;white-space:nowrap;text-align:right}
.camt.in{background:var(--pos-soft);color:var(--pos);padding:4px 9px;border-radius:9px}
.ndot{position:absolute;left:8px;top:50%;margin-top:-5px;width:10px;height:10px;border-radius:9px;background:var(--new)}

/* B */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.duo .card{padding:13px 14px;width:100%}
.duo .l{font-size:14px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.duo .v{font-size:clamp(20px,6vw,24px);font-weight:700;letter-spacing:-.02em;margin-top:3px;white-space:nowrap}
.duo .s{font-size:14px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:5px;border-radius:9px;background:#eceef4;margin-top:9px;overflow:hidden;display:flex;gap:2px}
.mini i{display:block;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px;margin:0 -14px;scroll-padding-inline:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.achip{flex:none;display:flex;align-items:center;gap:9px;min-height:48px;padding:5px 12px 5px 6px;border-radius:14px;background:#fff;box-shadow:var(--shadow);position:relative}
.achip .logo{width:34px;height:34px;border-radius:9px;font-size:12px}
.achip .n{font-size:14px;color:var(--ink-3);line-height:1.15}
.achip .b{font-size:16px;font-weight:650;line-height:1.2}
.achip[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.achip[aria-pressed=true] .n{color:#cbd5e1}
.achip .nb{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--new);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.since{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:4px}
.since .t{flex:1;min-width:0;font-size:15px}
.since b{font-weight:650}
.selhead{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:4px;width:100%}

/* C */
.tabsC{display:flex;gap:4px;padding:4px;margin:0 12px;border-radius:13px;background:#f1f3f7;overflow-x:auto;scrollbar-width:none}
.tabsC button{flex:1 0 auto;min-height:40px;padding:0 10px;border-radius:10px;font-size:15px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.tabsC button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.1)}
.tabsC em{display:var(--em,inline);font-style:normal;color:var(--ink-4);font-weight:500;margin-left:3px}
.gsum{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line);font-weight:650}
.peek{background:#fafbfd;border-top:1px solid var(--line)}
.peek[hidden]{display:none}
.peek .crow{padding-left:30px;min-height:60px;background:transparent}
.peek .crow .logo{width:34px;height:34px;font-size:12px}
.peek .crow .t1{font-size:16px}
.more{display:flex;justify-content:center;align-items:center;gap:4px;width:100%;min-height:48px;font-size:15px;font-weight:600;color:var(--accent-ink);border-top:1px solid var(--line)}
.btnrow{display:flex;gap:10px;padding:12px 16px 16px}
.btn{flex:1;min-height:46px;border-radius:12px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:var(--accent-soft);color:var(--accent-ink)}

/* detail */
.detail{position:absolute;inset:0;background:var(--bg);z-index:6;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.detail.open{transform:none}
.dhero{display:flex;align-items:center;gap:14px;padding:4px 4px 14px}
.dhero .fig{font-size:30px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;margin-bottom:12px;color:var(--warn)}
.banner .t{flex:1;color:var(--ink);font-size:15px}
.ctrl{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.filters{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.filters button{flex:none;min-height:40px;padding:0 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:15px;font-weight:550}
.filters button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sort{flex:none;display:flex;align-items:center;gap:4px;min-height:40px;font-weight:600;color:var(--accent-ink);font-size:15px}
.fab{position:absolute;right:16px;z-index:4;min-height:52px;padding:0 22px;border-radius:999px;background:var(--accent);color:#fff;font-weight:650;font-size:17px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(67,56,202,.32);transition:opacity .2s,transform .2s,visibility 0s}
.fab.gone{opacity:0;transform:translateY(10px);visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s}
.note{font-size:14px;color:var(--ink-3);text-align:center;margin:18px 10px 0;line-height:1.45}
.empty{padding:22px 16px;text-align:center;color:var(--ink-3)}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.32);z-index:8;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:#fff;border-radius:22px 22px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:80%;overflow-y:auto}
.sheet.open{transform:none}
.sheet .grip{width:40px;height:5px;border-radius:9px;background:#d5d9e2;margin:2px auto 10px}
.sheet h3{margin:4px 0 4px;font-size:20px;font-weight:650}
.sheet .sub{color:var(--ink-3);font-size:15px;margin-bottom:12px}
.calc .r{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:16px}
.calc .r:first-child{border-top:0}
.calc .r.tot{font-weight:700;font-size:18px;border-top:2px solid var(--ink)}
.calc .r.sub2{padding-left:14px;color:var(--ink-3);font-size:15px;border-top:0;padding-top:2px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cats button{min-height:52px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;font-weight:550}
.cats i{width:10px;height:10px;border-radius:9px;display:inline-block}
</style>
</head>
<body>
<div class="phone">
  <div class="mock" role="navigation" aria-label="Entwürfe">
    <span class="lbl">Runde 2</span>
    <div class="tabs" id="mtabs"></div>
    <button class="arr" id="mprev" aria-label="Voriger Entwurf"></button>
    <button class="arr" id="mnext" aria-label="Nächster Entwurf"></button>
  </div>
  <div class="app">
    <div class="bar" id="bar">
      <h1 id="bartitle">Übersicht</h1>
      <span class="chip">Demo</span>
      <button class="ib" aria-label="Suchen" data-ic="search"></button>
    </div>
    <main class="scroll" id="scroll"></main>
    <button class="fab gone" id="fabMain" style="bottom:calc(84px + env(safe-area-inset-bottom))"></button>
    <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>
    <section class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dtitle" inert></section>
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle" inert></section>
  </div>
</div>

    ${a&&a.err?`<div class="card banner">${ic('alert')}<span class="t">Letzte Datei vom 18.11. Neue Buchungen der Karte fehlen.</span><button class="pill-btn go">${ic('upload')} Datei</button></div>`:''}
    ${a&&a.stale?`<div class="card banner" style="color:var(--ink-3)">${ic('hand')}<span class="t">Von Hand gepflegt, zuletzt am 31.10.</span><button class="pill-btn go">Stand eintragen</button></div>`:''}
    <div class="ctrl"><div class="filters" role="group" aria-label="Filter">${[['alle','Alle'],['neu','Neu'],['pruefen','Zu prüfen'],['aus','Ausgaben'],['ein','Eingänge']].map(([k,l])=>`<button data-f="${k}" aria-pressed="${det.f===k}">${l}</button>`).join('')}</div><button class="sort" id="sort" aria-label="Sortierung umkehren">${ic('sort')}${det.asc?'Älteste':'Neueste'}</button></div>
    ${calmList(list,{acc:!det.id,sums:1})}
    <div class="note">Quelle: ${a?a.src:'alle Abrufe und Importe'}</div>
  </div>
  <button class="fab ${nNew?'':'gone'}" id="dfab" style="bottom:calc(24px + env(safe-area-inset-bottom))">${ic('check')}Alle gelesen</button>`;
  detail.querySelector('#back').onclick=closeDetail;
  detail.querySelector('#sort').onclick=()=>{det.asc=!det.asc;renderDetail()};
  detail.querySelector('#dfab').onclick=()=>{st.seen=true;renderDetail();draw(true)};
  detail.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{det.f=b.dataset.f;renderDetail()});
  wireCat(detail,renderDetail);
}
function openDetail(id,f){lastFocus=document.activeElement;det={id:id||'',f:f||'alle',asc:false};renderDetail();detail.inert=false;document.getElementById('scroll').inert=true;document.getElementById('nav').inert=true;requestAnimationFrame(()=>{detail.classList.add('open');detail.querySelector('#back').focus({preventScroll:true});document.querySelector('.app').scrollTop=0;document.querySelector('.phone').scrollTop=0})}
function closeDetail(){detail.classList.remove('open');detail.inert=true;document.getElementById('scroll').inert=false;document.getElementById('nav').inert=false;draw(true);if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus({preventScroll:true})}

/* ---------- sheets ---------- */
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');let sheetBack=null;
function openSheet(html,after){sheetBack=after;sheet.innerHTML=`<div class="grip"></div>${html}<button class="btn sec" style="width:100%;margin-top:16px" id="sclose">Schliessen</button>`;sheet.inert=false;sheet.classList.add('open');scrim.classList.add('open');sheet.querySelector('#sclose').onclick=closeSheet;sheet.querySelector('#sclose').focus({preventScroll:true});document.querySelector('.app').scrollTop=0}
function closeSheet(){sheet.classList.remove('open');scrim.classList.remove('open');sheet.inert=true;if(sheetBack)sheetBack();sheetBack=null}
scrim.onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sheet.classList.contains('open'))closeSheet();else if(detail.classList.contains('open'))closeDetail()}});
function paySheet(){openSheet(`<h3 id="stitle">Frei bis zum Lohn</h3><div class="sub">November · Lohn am ${PAY.day}, noch ${PAY.days} Tage</div><div class="calc">
  <div class="r"><span>Lohn 30.10.</span><span>${eur(PAY.net)}</span></div>
  <div class="r"><span>Ausgegeben seither</span><span>−${nf(PAY.spent)} €</span></div>
  <div class="r"><span>Noch fällig bis zum Lohn</span><span>−${nf(PAY.dueSum)} €</span></div>
  ${PAY.due.map(d=>`<div class="r sub2"><span>${d[2]} ${d[0]}</span><span>${nf(d[1])}</span></div>`).join('')}
  <div class="r tot"><span>Frei</span><span>${eur(PAY.free)}</span></div></div>
  <div class="sub" style="margin-top:10px">Das sind etwa ${n0(PAY.free/PAY.days)} € pro Tag. Fällige Posten kommen aus den erkannten Verträgen und Sparplänen.</div>`)}
function availSheet(){openSheet(`<h3 id="stitle">Verfügbar und gesamt</h3><div class="sub">Konten, Stand heute</div><div class="calc">
  ${['daily','save','inv'].map(g=>`<div class="r"><span>${G[g].t}</span><span>${eur(sumG(g))}</span></div>`).join('')}
  <div class="r tot"><span>Verfügbar</span><span>${eur(avail)}</span></div>
  <div class="r"><span>Vorsorge · nicht verfügbar</span><span>${eur(sumG('lock'))}</span></div>
  <div class="r tot"><span>Vermögen gesamt</span><span>${eur(total)}</span></div></div>`)}
function catSheet(id,rerender){const b=B.find(x=>x.id===id);openSheet(`<h3 id="stitle">Kategorie für ${b.m}</h3><div class="sub">${signed(b.v)} · ${short(b.d)} · ${acc(b.a).name}</div><div class="cats">${['Geschenke','Freizeit','Haushalt','Lebensmittel','Umbuchung','Sonstiges'].map(c=>`<button data-pick="${c}"><i style="background:${CATS[c]}"></i>${c}</button>`).join('')}</div>`);
  sheet.querySelectorAll('[data-pick]').forEach(p=>p.onclick=()=>{b.c=p.dataset.pick;b.l=['#475569',b.m.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()];st.reviewed.add(b.id);closeSheet();rerender&&rerender();draw(true)})}
function wireCat(root,rerender){root.querySelectorAll('[data-cat]').forEach(c=>c.onclick=e=>{e.stopPropagation();catSheet(+c.dataset.cat,rerender)})}

/* ---------- shell ---------- */
const V=[{k:'A',t:'Liste',f:vA},{k:'B',t:'Feed',f:vB},{k:'C',t:'Kompakt',f:vC}];
let cur=Math.min(2,Math.max(0,Number(new URLSearchParams(location.search).get('v')||0)));
const scroll=document.getElementById('scroll'),bar=document.getElementById('bar'),title=document.getElementById('bartitle'),fab=document.getElementById('fabMain');
function draw(keep){
  const y=keep?scroll.scrollTop:0;
  scroll.innerHTML=V[cur].f();
  scroll.style.paddingTop=V[cur].k==='A'?'0':'10px';
  scroll.scrollTop=y;
  document.getElementById('mtabs').innerHTML=V.map((v,i)=>`<button class="tab" data-v="${i}" ${i===cur?'aria-current="page"':''}>${v.k}<span class="nm"> · ${v.t}</span></button>`).join('');
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{cur=+b.dataset.v;history.replaceState(null,'','?v='+cur);draw()});
  fab.innerHTML=ic('check')+'Alle gelesen';
  fab.classList.toggle('gone',!(V[cur].k==='B'&&newOf(selB)));
  onScroll();wire();
}
function onScroll(){const isA=V[cur].k==='A',y=scroll.scrollTop;title.style.opacity=isA?(y>36?1:0):1;bar.classList.toggle('lined',y>4);const big=document.getElementById('bigt');if(big)big.style.opacity=y>36?0:1}
scroll.addEventListener('scroll',onScroll,{passive:true});
function wire(){
  scroll.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const g=b.dataset.tog;openA.has(g)?openA.delete(g):openA.add(g);draw(true)});
  scroll.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();openDetail(b.dataset.open,b.dataset.filter)});
  scroll.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{selB=b.dataset.sel===selB?'':b.dataset.sel;draw(true)});
  scroll.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tabC=b.dataset.tab;peekC.clear();draw(true)});
  scroll.querySelectorAll('[data-peek]').forEach(b=>b.onclick=()=>{const id=b.dataset.peek;peekC.has(id)?peekC.delete(id):peekC.add(id);draw(true)});
  scroll.querySelectorAll('[data-seen]').forEach(b=>b.onclick=()=>{st.seen=true;draw(true)});
  scroll.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{st.reviewed.add(+b.dataset.ok);draw(true)});
  scroll.querySelectorAll('[data-sheet]').forEach(b=>b.onclick=()=>b.dataset.sheet==='pay'?paySheet():availSheet());
  wireCat(scroll);
  const r=document.getElementById('refresh');
  if(r)r.onclick=()=>{const f=r.parentElement;f.classList.add('spin');setTimeout(()=>{f.classList.remove('spin');f.querySelector('span').textContent='Heute, '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})},1200)};
}
fab.onclick=()=>{st.seen=true;draw(true)};
document.getElementById('mprev').innerHTML=ic('left');document.getElementById('mnext').innerHTML=ic('right');
document.getElementById('mprev').onclick=()=>{cur=(cur+2)%3;history.replaceState(null,'','?v='+cur);draw()};
document.getElementById('mnext').onclick=()=>{cur=(cur+1)%3;history.replaceState(null,'','?v='+cur);draw()};
document.getElementById('nav').innerHTML=[['home','Übersicht',1],['cal','Monat'],['wallet','Vermögen'],['swap','Ausgaben'],['grid','Mehr']].map(([i,l,on])=>`<button ${on?'aria-current="page"':''}>${ic(i)}<span>${l}</span></button>`).join('');
draw();
</script>
</body>
</html>
